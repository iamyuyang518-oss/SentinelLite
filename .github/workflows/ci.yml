name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, and compile
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Rust stable with MSVC
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install JavaScript dependencies
        run: npm ci

      - name: npm vulnerability audit
        run: npm audit --audit-level=high

      - name: Frontend lint
        run: npm run lint

      - name: Frontend type checking
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Check generated application permissions are committed
        run: git diff --exit-code -- src-tauri/permissions

      - name: Regenerate dependency license inventory
        run: npm run licenses

      - name: Check license inventory is committed
        run: git diff --exit-code -- docs/THIRD_PARTY_INVENTORY.md
