[workspace]
members = [
  "crates/sentinel-core",
  "crates/sentinel-detection",
  "crates/sentinel-events",
  "crates/sentinel-ipc",
  "crates/sentinel-sensor",
  "crates/sentinel-storage",
  "src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["SentinelLite contributors"]
publish = false

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = "0.11.0"
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2.7.4", features = [] }
thiserror = "2.0.21"
verifysign = "1.0.1"
windows = "0.62.2"
windows-sys = "0.61.2"
winreg = "0.56.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
